<text x="96.7" y="82" text-anchor="middle" font-size="11.5" fill="#656d76">Smart India Hackathon</text>
<text x="96.7" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#1f2328">Winner</text>
</g>
<g class="in" style="animation-delay:0.06s">
<rect x="181.3" y="20" width="145.3" height="92" rx="8" fill="none" stroke="#eaeef2"/>
