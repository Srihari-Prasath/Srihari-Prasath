<text x="411.3" y="82" text-anchor="middle" font-size="11.5" fill="#656d76">Commits, 12 months</text>
<text x="411.3" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#1f2328">74</text>
</g>
<g class="in" style="animation-delay:0.18s">
<rect x="496.0" y="20" width="145.3" height="92" rx="8" fill="none" stroke="#eaeef2"/>
