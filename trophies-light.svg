<svg xmlns="http://www.w3.org/2000/svg" width="980" height="132" viewBox="0 0 980 132" role="img" aria-label="Trophies for Srihari Prasath">
<title>Trophies for Srihari Prasath</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="979" height="131" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<g class="sans"><g class="in" style="animation-delay:0.00s">
<rect x="24.0" y="20" width="145.3" height="92" rx="8" fill="none" stroke="#5b5bd6"/>
