<text x="254.0" y="82" text-anchor="middle" font-size="11.5" fill="#656d76">Contributions</text>
<text x="254.0" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#1f2328">730</text>
</g>
<g class="in" style="animation-delay:0.12s">
