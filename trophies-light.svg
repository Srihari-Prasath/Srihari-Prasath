<text x="568.7" y="82" text-anchor="middle" font-size="11.5" fill="#656d76">Repositories</text>
<text x="568.7" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#1f2328">17</text>
</g>
<g class="in" style="animation-delay:0.24s">
<rect x="653.3" y="20" width="145.3" height="92" rx="8" fill="none" stroke="#eaeef2"/>
