<text x="254.0" y="82" text-anchor="middle" font-size="11.5" fill="#8b949e">Contributions</text>
<text x="254.0" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#e6edf3">730</text>
</g>
<g class="in" style="animation-delay:0.12s">
