<text x="568.7" y="82" text-anchor="middle" font-size="11.5" fill="#8b949e">Repositories</text>
<text x="568.7" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#e6edf3">17</text>
</g>
<g class="in" style="animation-delay:0.24s">
<rect x="653.3" y="20" width="145.3" height="92" rx="8" fill="none" stroke="#21262d"/>
<text x="726.0" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#9b9cf9">C</text>
<text x="726.0" y="82" text-anchor="middle" font-size="11.5" fill="#8b949e">Followers</text>
<text x="726.0" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#e6edf3">23</text>
</g>
<g class="in" style="animation-delay:0.30s">
