<svg xmlns="http://www.w3.org/2000/svg" width="980" height="132" viewBox="0 0 980 132" role="img" aria-label="Trophies for Srihari Prasath">
<title>Trophies for Srihari Prasath</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="979" height="131" rx="10" fill="#0d1117" stroke="#30363d"/>
<g class="sans"><g class="in" style="animation-delay:0.00s">
<rect x="24.0" y="20" width="145.3" height="92" rx="8" fill="none" stroke="#9b9cf9"/>
<text x="96.7" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#9b9cf9">SIH &#39;23</text>
<text x="96.7" y="82" text-anchor="middle" font-size="11.5" fill="#8b949e">Smart India Hackathon</text>
<text x="96.7" y="100" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#e6edf3">Winner</text>
</g>
<g class="in" style="animation-delay:0.06s">
<rect x="181.3" y="20" width="145.3" height="92" rx="8" fill="none" stroke="#21262d"/>
