<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-label="Most used languages of Srihari Prasath">
<title>Most used languages of Srihari Prasath</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="479" height="229" rx="10" fill="#0d1117" stroke="#30363d"/>
<g class="sans"><text x="24" y="38" font-size="15" font-weight="600" fill="#e6edf3">Most used languages</text>
<text x="456" y="38" text-anchor="end" class="mono" font-size="11" fill="#8b949e">by code size</text>
<line x1="24" y1="52" x2="456" y2="52" stroke="#21262d"/>
<clipPath id="bar"><rect x="24" y="66" width="432" height="8" rx="4"/></clipPath>
<g clip-path="url(#bar)"><rect x="24.0" y="66" width="162.1" height="8" fill="#A97BFF" style="animation:grow .8s 0.00s cubic-bezier(.2,.7,.2,1) both;transform-origin:24.0px 0"/><rect x="188.1" y="66" width="118.6" height="8" fill="#4F5D95" style="animation:grow .8s 0.05s cubic-bezier(.2,.7,.2,1) both;transform-origin:188.1px 0"/><rect x="308.8" y="66" width="67.2" height="8" fill="#00B4AB" style="animation:grow .8s 0.10s cubic-bezier(.2,.7,.2,1) both;transform-origin:308.8px 0"/><rect x="378.0" y="66" width="34.7" height="8" fill="#3572A5" style="animation:grow .8s 0.15s cubic-bezier(.2,.7,.2,1) both;transform-origin:378.0px 0"/><rect x="414.7" y="66" width="30.3" height="8" fill="#f1e05a" style="animation:grow .8s 0.20s cubic-bezier(.2,.7,.2,1) both;transform-origin:414.7px 0"/><rect x="447.0" y="66" width="4.7" height="8" fill="#41b883" style="animation:grow .8s 0.25s cubic-bezier(.2,.7,.2,1) both;transform-origin:447.0px 0"/><rect x="453.7" y="66" width="2.3" height="8" fill="#F05138" style="animation:grow .8s 0.30s cubic-bezier(.2,.7,.2,1) both;transform-origin:453.7px 0"/></g>
<g class="in" style="animation-delay:0.30s">
<circle cx="29" cy="106" r="5" fill="#A97BFF"/>
<text x="42" y="110" font-size="13" fill="#e6edf3">Kotlin</text>
<text x="220" y="110" text-anchor="end" class="mono" font-size="12" fill="#8b949e">39%</text>
</g>
<g class="in" style="animation-delay:0.34s">
<circle cx="249" cy="106" r="5" fill="#4F5D95"/>
<text x="262" y="110" font-size="13" fill="#e6edf3">PHP</text>
<text x="440" y="110" text-anchor="end" class="mono" font-size="12" fill="#8b949e">28%</text>
</g>
<g class="in" style="animation-delay:0.38s">
<circle cx="29" cy="134" r="5" fill="#00B4AB"/>
<text x="42" y="138" font-size="13" fill="#e6edf3">Dart</text>
<text x="220" y="138" text-anchor="end" class="mono" font-size="12" fill="#8b949e">16%</text>
</g>
<g class="in" style="animation-delay:0.42s">
<circle cx="249" cy="134" r="5" fill="#3572A5"/>
<text x="262" y="138" font-size="13" fill="#e6edf3">Python</text>
<text x="440" y="138" text-anchor="end" class="mono" font-size="12" fill="#8b949e">8.3%</text>
</g>
<g class="in" style="animation-delay:0.46s">
<circle cx="29" cy="162" r="5" fill="#f1e05a"/>
<text x="42" y="166" font-size="13" fill="#e6edf3">JavaScript</text>
<text x="220" y="166" text-anchor="end" class="mono" font-size="12" fill="#8b949e">7.2%</text>
</g>
<g class="in" style="animation-delay:0.50s">
<circle cx="249" cy="162" r="5" fill="#41b883"/>
<text x="262" y="166" font-size="13" fill="#e6edf3">Vue</text>
<text x="440" y="166" text-anchor="end" class="mono" font-size="12" fill="#8b949e">1.1%</text>
</g>
<g class="in" style="animation-delay:0.54s">
<circle cx="29" cy="190" r="5" fill="#F05138"/>
<text x="42" y="194" font-size="13" fill="#e6edf3">Swift</text>
<text x="220" y="194" text-anchor="end" class="mono" font-size="12" fill="#8b949e">0.5%</text>
</g></g>
</svg>
