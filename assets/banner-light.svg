  <text x="78" y="186" class="mono" font-size="18" fill="#1f2328" clip-path="url(#t0)">building Android apps in Kotlin</text><text x="78" y="186" class="mono" font-size="18" fill="#1f2328" clip-path="url(#t1)">encrypting secrets with Android Keystore</text><text x="78" y="186" class="mono" font-size="18" fill="#1f2328" clip-path="url(#t2)">shipping APIs with ASP.NET Core</text><text x="78" y="186" class="mono" font-size="18" fill="#1f2328" clip-path="url(#t3)">thinking like an attacker, building like a defender</text><text x="78" y="186" class="mono" font-size="18" fill="#1f2328" clip-path="url(#t4)">crafting dashboards in React</text><text x="78" y="186" class="mono" font-size="18" fill="#1f2328" clip-path="url(#t5)">keeping your data on the device</text>
