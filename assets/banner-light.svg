<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">Srihari Prasath</title>
<desc id="desc">Developer and cyber enthusiast from Tamil Nadu, India: Android apps in Kotlin, secrets encrypted with Android Keystore, APIs with ASP.NET Core, dashboards in React. Smart India Hackathon 2023 winner.</desc>
